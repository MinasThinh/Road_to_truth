<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đấu Trường Triết Học</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#070d17;--pn:#0c1626d9;--ink:#e8e4d6;--mut:#8b97a8;--gold:#e2b04a;--cy:#4fd1c5;--bad:#ff6b6b;--ln:#1f3147}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.6 'Be Vietnam Pro',sans-serif;background:var(--bg)}
#bg{position:fixed;inset:0;z-index:-2;width:100%;height:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.18) 3px 4px),radial-gradient(ellipse at 50% 0,rgba(31,78,140,.35),transparent 65%)}
h1,h2,h3{font-family:'Playfair Display',serif;margin:.2em 0;line-height:1.2;color:#f3e9cf}
h1{font-size:clamp(30px,6vw,58px);font-weight:900}h2{font-size:24px}h3{font-size:18px}
small,.fl,table,.log{font-family:'JetBrains Mono',monospace}
.wrap{max-width:1250px;margin:auto;padding:14px}
.card{background:var(--pn);backdrop-filter:blur(4px);border:1px solid var(--ln);border-left:3px solid var(--cy);padding:14px;margin-bottom:12px;position:relative}
.card::after{content:"";position:absolute;right:-1px;top:-1px;width:14px;height:14px;border:solid var(--gold);border-width:2px 2px 0 0}
.btn{font:600 15px 'Be Vietnam Pro';background:var(--gold);color:#1a1204;border:0;padding:10px 18px;cursor:pointer;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.btn.alt{background:transparent;color:var(--cy);box-shadow:inset 0 0 0 1.5px var(--cy);clip-path:none}.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,.opt:focus-visible{outline:3px solid var(--cy)}
input,select{font:inherit;padding:9px;border:1px solid var(--ln);background:#09111e;color:var(--ink);max-width:100%}
.g3{display:grid;gap:12px;grid-template-columns:1fr 1.5fr 1fr}@media(max-width:950px){.g3{grid-template-columns:1fr}}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;background:#09111e;border:1px solid var(--ln);font:inherit;color:var(--ink);cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--cy);box-shadow:0 0 14px rgba(79,209,197,.25)}
.m{border-left-color:var(--gold)}.m.done{border-left-color:var(--cy)}
.vs{display:flex;justify-content:space-between;gap:8px;margin:6px 0}.win{color:var(--gold)}
.hp{display:flex;gap:4px;margin:4px 0}.hp i{flex:1;height:10px;background:var(--cy);box-shadow:0 0 8px var(--cy)}.hp i.x{background:#22344a;box-shadow:none}
.bs{width:56px}.bs.d{filter:grayscale(1) opacity(.35)}
.log{max-height:230px;overflow:auto;font-size:13px}.log p{margin:3px 0}.log p::before{content:"> ";color:var(--cy)}
small,.mut{color:var(--mut);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0d1b2e;border:1px solid var(--cy);color:var(--ink);padding:10px 18px;z-index:9}
.end{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#14305a,#050a12);color:#f1efe9;overflow:auto;z-index:5;padding:24px;text-align:center}
.end .r{font:700 clamp(20px,4vw,34px) 'Playfair Display',serif;margin:10px 0}.end .r:first-of-type{color:var(--gold);font-size:clamp(28px,6vw,52px)}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:3px 4px;border-bottom:1px solid var(--ln)}
.hero{text-align:center;padding:40px 10px}
.shake{animation:sk .35s}@keyframes sk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media(prefers-reduced-motion:no-preference){.pulse{animation:p 2s ease-in-out infinite}@keyframes p{50%{opacity:.55}}.gl{animation:gl 4s infinite steps(1)}@keyframes gl{0%,92%,100%{text-shadow:0 0 22px rgba(226,176,74,.35)}94%{text-shadow:3px 0 var(--cy),-3px 0 var(--bad)}}}
</style></head><body><canvas id="bg"></canvas><canvas id="cf" style="position:fixed;inset:0;pointer-events:none;z-index:8"></canvas><div class="wrap" id="app"></div><div class="toast" id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TEAMS=[1,2,3,4,6,7],ROOM=(new URLSearchParams(location.search).get('room')||'').replace(/[^A-Za-z0-9]/g,''),LS=localStorage;
const TEMPLE=`<svg viewBox="0 0 200 90" width="220" aria-hidden="true"><path d="M10 28 100 6l90 22z" fill="#e2b04a"/><rect x="14" y="30" width="172" height="6" fill="#4fd1c5"/>${[30,62,94,126,158].map(x=>`<rect x="${x}" y="38" width="12" height="40" fill="#12233a" stroke="#4fd1c5" stroke-width="2"/>`).join('')}<rect x="8" y="78" width="184" height="8" fill="#e2b04a"/></svg>`;
const BASE=TEMPLE.replace('220','56'),hpb=(m,t)=>[0,1,2].map(i=>`<i class="${i<3-m.prog[t==m.a?m.b:m.a].s?'':'x'}"></i>`).join('');
const QUOTES=['Tôi chỉ biết rằng tôi không biết gì. — Socrates','Cuộc đời chưa được xem xét thì không đáng sống. — Socrates','Triết học bắt đầu từ sự ngạc nhiên. — Aristotle'];
/* Đề thi KHÔNG nằm trong mã nguồn: host nạp file .json từ máy (xem de-mau.json). Đáp án chỉ tồn tại trong trình duyệt của host. */
/* ---------- âm thanh (WebAudio, không cần file) ---------- */
let AC,MUTE=LS.tl_mute=='1';const NT=[293.66,329.63,369.99,440,493.88,587.33];
addEventListener('pointerdown',()=>AC=AC||new AudioContext(),{once:true});
function tone(f,d=.5,v=.06,ty='sine',t0=0){if(!AC||MUTE)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}
const sfx={ok:()=>[0,2,4].forEach((n,i)=>tone(NT[n]*2,.4,.07,'triangle',i*.09)),bad:()=>tone(170,.35,.06,'triangle'),flag:()=>[0,2,3,5].forEach((n,i)=>tone(NT[n]*2,.7,.07,'triangle',i*.12)),end:()=>[0,3,5,3,5].forEach((n,i)=>tone(NT[n]*2,.9,.07,'triangle',i*.25))};
function mute(){MUTE=!MUTE;LS.tl_mute=MUTE?'1':'0';toast(MUTE?'Đã tắt âm hiệu':'Đã bật âm hiệu')}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t.h);t.h=setTimeout(()=>t.hidden=true,2400)}
const sh=a=>a.sort(()=>Math.random()-.5),hex=()=>[...crypto.getRandomValues(new Uint8Array(6))].map(b=>b.toString(16).padStart(2,'0')).join('');
/* ===== Firebase: dán cấu hình của bạn (Project settings > Your apps > Web app). Khóa API này vốn công khai, bảo mật nằm ở Rules. ===== */
const FB={
  apiKey: "AIzaSyAqaiD9tDDjl_tlk-KBMiYIpWKPn-iKfXI",
  authDomain: "roadtotruth-1ac11.firebaseapp.com",
  databaseURL: "https://roadtotruth-1ac11-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "roadtotruth-1ac11",
  storageBucket: "roadtotruth-1ac11.firebasestorage.app",
  messagingSenderId: "595058707456",
  appId: "1:595058707456:web:13aa354adb200aac505ce5"
};;
let db,auth;const fbOK=()=>!/DÁN|TEN-DU-AN/.test(JSON.stringify(FB));
function fbInit(){if(!firebase.apps.length)firebase.initializeApp(FB);auth=firebase.auth();db=firebase.database();return new Promise(res=>{const u=auth.onAuthStateChanged(x=>{u();x?res(x):auth.signInAnonymously().then(r=>res(r.user))})})}
const SNDBTN='<button class="btn alt" onclick="mute()">Âm hiệu</button>';
/* ============================ HOST ============================ */
let S,UID,sent={};const mk=pid=>({pid,send:o=>db.ref(`rooms/${S.room}/${o.k=='fb'?'fb':'st'}/${pid}`).set({...o,n:Date.now()})});
function lb(){const t=TEAMS.map(x=>({t:x,...S.tw[x]})).sort((a,b)=>b.w-a.w||b.f-a.f);const p=Object.values(S.players).sort((a,b)=>b.pts-a.pts).slice(0,10).map(x=>({n:x.name,t:x.team,pts:x.pts}));return{t,p}}
const mOf=t=>S.matches.find(m=>m.a==t||m.b==t),ch=c=>S.qs[(S.stage*3+c)%S.qs.length];
function log(m){S.log.unshift({t:new Date().toLocaleTimeString('vi-VN'),m});S.log.length=Math.min(S.log.length,80)}
function bc(){LS.tl_host=JSON.stringify(S);hostR();for(const pid in S.players){const v=JSON.stringify(view(pid));if(sent[pid]!==v){sent[pid]=v;db.ref(`rooms/${S.room}/st/${pid}`).set(JSON.parse(v))}}}
function view(pid){const p=S.players[pid],m=mOf(p.team),o={k:'st',stage:S.stage,me:{n:p.name,t:p.team,pts:p.pts},lb:lb(),rank:S.stage==3?Object.fromEntries(Object.entries(S.rank).map(([t,r])=>['t'+t,r])):null};
 if(m&&S.stage>=0&&S.stage<3){const a=m.prog[p.team],oT=m.a==p.team?m.b:m.a,b=m.prog[oT];o.m={tag:m.tag,opp:oT,my:{c:a.c,q:a.q,s:a.s,last:a.last||null},op:{c:b.c,s:b.s},win:m.win};
  if(!m.win&&!a.flag&&a.c<3){const x=ch(a.c),q=x.qs[a.q];o.m.title=x.title;o.q={t:q.t,q:q.q,o:q.o}}}   // KHÔNG bao giờ gửi đáp án
 return o}
function startStage(n){const T=sh(TEAMS.slice());let pr;
 if(n==0)pr=[[T[0],T[1],'Vòng loại'],[T[2],T[3],'Vòng loại'],[T[4],T[5],'Vòng loại']];
 else{const W=sh(S.matches.map(m=>m.win)),L=sh(S.matches.map(m=>m.lose));
  if(n==1)pr=[[W[0],W[1],'Bán kết: nhánh thắng'],[L[0],L[1],'Bán kết: nhánh thua'],[W[2],L[2],'Bán kết: giao thoa']];
  else{const[ww,ll,wl]=S.matches;S.rank[ll.win]=5;S.rank[ll.lose]=6;pr=[[ww.win,wl.win,'Chung kết: tranh hạng 1-2'],[ww.lose,wl.lose,'Tranh hạng 3-4']]}}
 S.stage=n;S.ready=false;S.matches=pr.map(([a,b,tag])=>({a,b,tag,win:0,lose:0,prog:{[a]:{c:0,q:0,s:0,flag:null},[b]:{c:0,q:0,s:0,flag:null}}}));
 log(`Bắt đầu ${['vòng loại','bán kết','chung kết'][n]}: `+S.matches.map(m=>`Nhóm ${m.a} đấu Nhóm ${m.b}`).join(', '));bc()}
function nextStage(){if(S.stage<0&&!S.qs.length)return toast('Hãy nạp file đề (.json) trước');if(S.stage<0){const miss=TEAMS.filter(t=>!Object.values(S.players).some(p=>p.team==t));if(miss.length&&!confirm('Nhóm '+miss.join(', ')+' chưa có người chơi. Vẫn bắt đầu?'))return}
 if(S.stage>=0&&!S.ready)return;if(S.stage<2)startStage(S.stage+1);else{const[a,b]=S.matches;S.rank[a.win]=1;S.rank[a.lose]=2;S.rank[b.win]=3;S.rank[b.lose]=4;S.stage=3;log('Kết thúc giải đấu!');bc();sfx.end();boom(3)}}
function ans(c,p,v,qi){const m=mOf(p.team);if(!m||m.win||S.stage<0||S.stage>2)return;const a=m.prog[p.team];if(a.flag||a.c>2)return;
 if(qi!==a.c*3+a.q)return c.send({k:'fb',ok:0,m:'Đồng đội vừa trả lời câu này rồi.'});
 if(Date.now()<p.cd||Date.now()<(a.lk||0))return c.send({k:'fb',ok:0,m:'Hãy suy ngẫm thêm chút rồi trả lời.'});
 const q=ch(a.c).qs[a.q];let ok=q.t=='fill'?Array.isArray(v)&&v.length==q.a.length&&v.every((x,i)=>x===q.a[i]):v===q.a;
 if(!ok){a.w=(a.w||0)+1;p.cd=Date.now()+2000;if(a.w%3==0)a.lk=Date.now()+Math.min(a.w*2500,20000);return c.send({k:'fb',ok:0,m:a.lk>Date.now()?'Nhóm bị khoá tạm thời vì trả lời sai liên tiếp.':'Chưa đúng, hãy thử lại.'})}
 p.pts++;a.q++;a.w=0;a.lk=0;c.send({k:'fb',ok:1});
 if(a.q>2){const f='FLAG{'+hex()+'}';a.last=f;a.s++;a.c++;a.q=0;S.tw[p.team].f++;log(`Nhóm ${p.team} giải xong thử thách và chiếm flag (${m.tag}); căn cứ đối thủ còn ${3-a.s}/3`);
  if(a.s>=3){m.win=p.team;m.lose=m.a==p.team?m.b:m.a;S.tw[p.team].w++;log(`Nhóm ${p.team} chiếm căn cứ Nhóm ${m.lose} (${m.tag})`);if(S.ready=S.matches.every(x=>x.win))log('Mọi trận trong vòng đã kết thúc.')}}bc()}
function onMsg(c,d){if(!d||typeof d!='object')return;
 if(d.k=='join'){const pid=c.pid,n=String(d.name||'').trim().slice(0,20),t=+d.team;let p=S.players[pid];
  if(!p){if(!n||!TEAMS.includes(t)||Object.keys(S.players).length>=80)return c.send({k:'err',m:'Tên hoặc nhóm không hợp lệ'});p=S.players[pid]={name:n,team:t,pts:0,cd:0};log(`${n} gia nhập Nhóm ${t}`)}
  c.pid=pid;delete sent[pid];return bc()}
 const p=S.players[c.pid];if(!p)return;const now=Date.now();if(now-(p.lt||0)<250)return;p.lt=now;if(d.k=='ans')ans(c,p,d.v,d.qi)}
async function startHost(){try{UID=(await fbInit()).uid;const r=await db.ref(`rooms/${S.room}/host`).transaction(c=>c===null||c===UID?UID:undefined);
 if(!r.committed){alert('Mã phòng đã có người dùng. Hãy tạo phòng mới.');return hostLanding()}
 db.ref(`rooms/${S.room}/in`).on('child_added',x=>{const d=x.val();x.ref.remove();const pid=d&&String(d.pid||'').replace(/[^A-Za-z0-9]/g,'').slice(0,40);if(pid)onMsg(mk(pid),d)});
 hostUI();bc()}catch(x){alert('Lỗi Firebase: '+x.message+'\nKiểm tra đã bật Anonymous Auth và Realtime Database chưa.')}}
function hostLanding(){const old=LS.tl_host;$('#app').innerHTML=`<div class="hero">${TEMPLE}<h1 class="gl">Đấu Trường Triết Học</h1><p style="max-width:560px;margin:auto">Sáu nhóm tấn công căn cứ của nhau bằng tri thức. Ai giải xong ba thử thách và cắm đủ ba flag trước sẽ thắng.</p><p><button class="btn" id="nr">Tạo phòng mới</button> ${old?'<button class="btn alt" id="rs">Mở lại phòng đang dở</button>':''}</p><p class="mut">${QUOTES[Math.random()*3|0]}</p></div>`;
 $('#nr').onclick=()=>{S={room:Math.random().toString(36).slice(2,6).toUpperCase(),qs:[],stage:-1,ready:false,matches:[],players:{},tw:{},rank:{},log:[]};TEAMS.forEach(t=>S.tw[t]={w:0,f:0});startHost()};
 if(old)$('#rs').onclick=()=>{S=JSON.parse(old);startHost()}}
function hostUI(){const url=location.origin+location.pathname+'?room='+S.room;
 $('#app').innerHTML=`<div class="top"><div style="display:flex;gap:12px;align-items:center">${TEMPLE.replace('220','90')}<div><h2>Đấu Trường Triết Học</h2><small id="stg"></small></div></div><div>${SNDBTN} <label class="btn alt">Nạp đề <input type="file" id="qf" accept=".json" hidden></label> <button class="btn" id="nx"></button></div></div>
 <div class="g3"><div><div id="jn"><div class="card" style="text-align:center"><h3>Mã phòng ${S.room}</h3><div id="qr" style="display:inline-block;padding:8px;background:#fff"></div><p><small style="word-break:break-all">${url}</small></p></div><div class="card"><h3>Người chơi</h3><div id="ro"></div></div></div><div class="card"><h3>Khung chat trận đấu</h3><div class="log" id="lg"></div></div></div>
 <div><div id="mt"></div></div>
 <div><div class="card"><h3>Bảng xếp hạng nhóm</h3><div id="lt"></div></div><div class="card"><h3>Bảng xếp hạng cá nhân</h3><div id="lp"></div></div></div></div><div id="en"></div>`;
 new QRCode($('#qr'),{text:url,width:170,height:170,colorDark:'#000000',colorLight:'#ffffff'});
 $('#nx').onclick=nextStage;
 $('#qf').onchange=async ev=>{try{const j=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(j)||!j.length||!j.every(c=>c.title&&Array.isArray(c.qs)&&c.qs.length==3&&c.qs.every(q=>q.q&&'a' in q)))throw 0;S.qs=j;log(`Đã nạp đề: ${j.length} thử thách`);bc();toast('Đã nạp đề')}catch{toast('File đề không đúng định dạng')}}}
function hostR(){if(!$('#mt'))return;$('#jn').hidden=S.stage>=0;$('#lg').style.maxHeight=S.stage>=0?'72vh':'230px';const L=lb();
 $('#stg').textContent=['Phòng chờ','Vòng loại','Bán kết','Chung kết','Kết thúc'][S.stage+1]+(S.qs.length?` (${S.qs.length} thử thách trong đề)`:' (chưa nạp đề)');
 const nx=$('#nx');nx.hidden=S.stage==3;nx.disabled=(S.stage>=0&&!S.ready)||(S.stage<0&&!S.qs.length);nx.textContent=['Bắt đầu vòng loại','Sang bán kết','Sang chung kết','Công bố kết quả'][S.stage<0?0:S.stage+1>3?3:S.stage+1];
 $('#ro').innerHTML=TEAMS.map(t=>`<p style="margin:4px 0"><b>Nhóm ${t}</b> <small>${Object.values(S.players).filter(p=>p.team==t).map(p=>e(p.name)).join(', ')||'chưa có ai'}</small></p>`).join('');
 $('#mt').innerHTML=S.matches.map(m=>`<div class="card m ${m.win?'done':''}"><small>${e(m.tag)}</small><div class="vs">${[m.a,m.b].map(t=>{const a=m.prog[t];return`<div><h3 class="${m.win==t?'win':''}">Nhóm ${t}${m.win==t?' (thắng)':''}</h3><div class="bs ${m.win&&m.win!=t?'d':''}">${BASE}</div><div class="hp">${hpb(m,t)}</div>${[0,1,2].map(i=>`<span class="dot ${i<a.s?'on':''}"></span>`).join('')}<br><small>${m.win?'':`Thử thách ${a.c+1}/3, câu ${Math.min(a.q+1,3)}/3`}</small></div>`}).join('<h3 class="mut">đấu</h3>')}</div></div>`).join('')||'<div class="card"><p class="mut pulse">Nạp file đề (.json), chờ các nhóm vào phòng rồi bấm "Bắt đầu vòng loại".</p></div>';
 $('#lg').innerHTML=S.log.map(l=>`<p><small>${l.t}</small> ${e(l.m)}</p>`).join('');
 $('#lt').innerHTML='<table>'+L.t.map((x,i)=>`<tr><td>${i+1}</td><td>Nhóm ${x.t}</td><td>${x.w} thắng</td><td>${x.f} flag</td></tr>`).join('')+'</table>';
 $('#lp').innerHTML='<table>'+L.p.map((x,i)=>`<tr><td>${i+1}</td><td>${e(x.n)}</td><td>Nhóm ${x.t}</td><td>${x.pts}</td></tr>`).join('')+'</table>';
 $('#en').innerHTML=S.stage==3?`<div class="end">${TEMPLE.replace('220','200')}<h1>Bảng Vàng</h1>${Object.entries(S.rank).sort((a,b)=>a[1]-b[1]).map(([t,r])=>`<div class="r">Hạng ${r}: Nhóm ${t}</div>`).join('')}<h3>Những người đóng góp nhiều nhất</h3>${L.p.slice(0,5).map((x,i)=>`<div>${i+1}. ${e(x.n)} (Nhóm ${x.t}): ${x.pts} điểm</div>`).join('')}<p><button class="btn alt" style="color:#fff;border-color:#fff" onclick="$('#en').innerHTML=''">Đóng</button></p></div>`:''}
/* ============================ PLAYER ============================ */
let V,sig='',me=JSON.parse(LS['tl_p_'+ROOM]||'null');
function playerJoin(){$('#app').innerHTML=`<div class="hero">${TEMPLE}<h1>Vào đấu trường</h1><div class="card" style="max-width:380px;margin:20px auto;text-align:left"><p>Tên của bạn<br><input id="nm" maxlength="20" style="width:100%"></p><p>Nhóm của bạn<br><select id="tm" style="width:100%">${TEAMS.map(t=>`<option value="${t}">Nhóm ${t}</option>`).join('')}</select></p><button class="btn" id="go" style="width:100%">Tham gia</button></div></div>`;
 $('#go').onclick=()=>{const n=$('#nm').value.trim();if(!n)return toast('Hãy nhập tên');me={pid:hex()+hex(),name:n,team:+$('#tm').value};LS['tl_p_'+ROOM]=JSON.stringify(me);connect()}}
async function connect(){$('#app').innerHTML='<div class="hero"><h2 class="pulse">Đang vào phòng '+e(ROOM)+'…</h2></div>';
 try{await fbInit()}catch(x){return alert('Lỗi Firebase: '+x.message)}
 const b=`rooms/${ROOM}`;let first=1;
 db.ref(`${b}/st/${me.pid}`).on('value',s=>{const v=s.val();if(v)onData({k:'st',...v})});
 db.ref(`${b}/fb/${me.pid}`).on('value',s=>{if(first){first=0;return}const v=s.val();if(v)onData(v)});
 send({k:'join',name:me.name,team:me.team});
 setTimeout(()=>{if(!V)$('#app').innerHTML+='<p class="mut" style="text-align:center">Chưa thấy chủ trò phản hồi. Hãy kiểm tra mã phòng hoặc chờ thêm.</p>'},8000)}
function send(o){db.ref(`rooms/${ROOM}/in`).push({...o,pid:me.pid,...(o.k=='ans'&&V&&V.m?{qi:V.m.my.c*3+V.m.my.q}:{})}).catch(()=>toast('Không gửi được, kiểm tra kết nối mạng'))}
function onData(d){if(d.k=='err'){delete LS['tl_p_'+ROOM];me=null;toast(d.m);return playerJoin()}
 if(d.k=='fb'){toast(d.m||(d.ok==1?'Chính xác!':'Cờ đã cắm vào căn cứ đối thủ!'));d.ok?sfx.ok():(sfx.bad(),shake());return}
 if(d.k=='st'){const old=V;V=d;if(!$('#qb'))skeleton();pR();fx(old,d);if(V.stage==3&&(!old||old.stage!=3)){sfx.end();boom(3)}}}
function skeleton(){$('#app').innerHTML=`<div class="top"><div id="hd"></div>${SNDBTN}</div><div id="mi"></div><div id="qb"></div><div class="card"><h3>Bảng xếp hạng</h3><div id="pl"></div></div>`}
function pR(){const v=V;$('#hd').innerHTML=`<h2>${e(v.me.n)}</h2><small>Nhóm ${v.me.t}, ${v.me.pts} điểm cá nhân</small>`;
 $('#pl').innerHTML='<table>'+v.lb.t.map((x,i)=>`<tr><td>${i+1}</td><td>Nhóm ${x.t}</td><td>${x.w} thắng</td><td>${x.f} flag</td></tr>`).join('')+'</table><br><table>'+(v.lb.p||[]).slice(0,5).map((x,i)=>`<tr><td>${i+1}</td><td>${e(x.n)}</td><td>${x.pts}</td></tr>`).join('')+'</table>';
 const m=v.m;$('#mi').innerHTML=m?`<div class="card m"><small>${e(m.tag)}</small><div class="vs"><div><b>Nhóm ${v.me.t}</b> <small>căn cứ của ta</small><div class="hp">${[0,1,2].map(i=>`<i class="${i<3-m.op.s?'':'x'}"></i>`).join('')}</div></div><div style="text-align:right"><b>Nhóm ${m.opp}</b> <small>căn cứ đối thủ</small><div class="hp">${[0,1,2].map(i=>`<i class="${i<3-m.my.s?'':'x'}"></i>`).join('')}</div></div></div></div>`:'';
 const ns=JSON.stringify([v.stage,v.q,m&&m.my.s,m&&m.win]);if(ns==sig)return;sig=ns;const qb=$('#qb');let h='';
 if(v.stage<0)h='<div class="card"><h3 class="pulse">Phòng chờ</h3><p>Chủ trò sẽ bắt đầu trận đấu trong giây lát.</p></div>';
 else if(v.stage==3)h=`<div class="card"><h2>Kết quả chung cuộc</h2>${Object.entries(v.rank).map(([t,r])=>[t.slice(1),r]).sort((a,b)=>a[1]-b[1]).map(([t,r])=>`<p class="${t==v.me.t?'win':''}">Hạng ${r}: Nhóm ${t}</p>`).join('')}</div>`;
 else if(m&&m.win)h=`<div class="card"><h2 class="${m.win==v.me.t?'win':''}">${m.win==v.me.t?'Nhóm bạn đã chiếm được căn cứ!':'Căn cứ của nhóm bạn đã thất thủ.'}</h2><p>Hãy chờ chủ trò mở vòng tiếp theo.</p></div>`;
 else if(v.q){const q=v.q;h=`<div class="card"><small>${e(m.title)}, câu ${m.my.q+1}/3</small><h3 style="font-weight:500;font-size:20px">`;
  if(q.t=='fill')h+=e(q.q).replace(/\{(\d)\}/g,(_,i)=>`<select data-i="${i}"><option value="">…</option>${q.o[i].map((o,j)=>`<option value="${j}">${e(o)}</option>`).join('')}</select>`)+`</h3><button class="btn" id="fs">Gửi đáp án</button>`;
  else if(q.t=='tf')h+=e(q.q)+`</h3><button class="opt" data-v="1">Đúng</button><button class="opt" data-v="0">Sai</button>`;
  else h+=e(q.q)+'</h3>'+q.o.map((o,i)=>`<button class="opt" data-v="${i}">${e(o)}</button>`).join('');
  qb.innerHTML=h+'</div>';
  qb.querySelectorAll('.opt').forEach(b=>b.onclick=()=>send({k:'ans',v:q.t=='tf'?b.dataset.v=='1':+b.dataset.v}));
  const fs=$('#fs');if(fs)fs.onclick=()=>{const s=[...qb.querySelectorAll('select')];if(s.some(x=>x.value===''))return toast('Hãy chọn đủ các chỗ trống');send({k:'ans',v:s.map(x=>+x.value)})};return}
 qb.innerHTML=h}
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
function shake(q='#qb'){const x=$(q);if(!x)return;x.classList.remove('shake');void x.offsetWidth;x.classList.add('shake')}
function fx(o,d){if(!o||!o.m||!d.m)return;if(d.m.my.s>o.m.my.s){boom();sfx.flag();toast('Đã chiếm '+(d.m.my.last||'flag'))}if(d.m.op.s>o.m.op.s){sfx.bad();shake('#mi')}if(d.m.win&&!o.m.win&&d.m.win==d.me.t)boom(3)}
function boom(n=1){if(RM)return;const c=$('#cf'),x=c.getContext('2d'),G='αβγδλπφψΩ∴∞'.split(''),W=innerWidth,H=innerHeight;c.width=W;c.height=H;
 const P=Array.from({length:50*n},()=>({x:W/2,y:H*.6,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,g:G[Math.random()*G.length|0],c:Math.random()<.5?'#e2b04a':'#4fd1c5',s:16+Math.random()*16,l:0}));
 (function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.l++;x.globalAlpha=Math.max(0,1-p.l/90);x.fillStyle=p.c;x.font=p.s+'px Playfair Display';x.fillText(p.g,p.x,p.y)});P[0].l<90?requestAnimationFrame(f):x.clearRect(0,0,W,H)})()}
(function(){const c=$('#bg'),x=c.getContext('2d'),G='αβγδεζηθλμπσφψωΩ∴∞∃∀'.split('');let w,h,y;
 function rs(){w=c.width=innerWidth;h=c.height=innerHeight;y=Array.from({length:Math.ceil(w/24)},()=>Math.random()*h/16|0);x.fillStyle='#070d17';x.fillRect(0,0,w,h)}rs();addEventListener('resize',rs);if(RM)return;
 setInterval(()=>{x.fillStyle='rgba(7,13,23,.14)';x.fillRect(0,0,w,h);x.font='16px JetBrains Mono';y.forEach((v,i)=>{x.fillStyle=Math.random()<.04?'#e2b04a':'rgba(79,209,197,.38)';x.fillText(G[Math.random()*G.length|0],i*24,v*16);y[i]=v*16>h&&Math.random()>.975?0:v+1})},90)})();
/* ---------- khởi động ---------- */
if(!fbOK())$('#app').innerHTML='<div class="hero"><h2>Chưa cấu hình Firebase</h2><p>Mở index.html, điền thông tin vào biến FB ở đầu phần script.</p></div>';else if(!ROOM)hostLanding();else if(me)connect();else playerJoin();
</script></body></html>
