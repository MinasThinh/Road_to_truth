<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đấu Trường Triết Học</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--mb:#e6e4de;--card:#f5f4ef;--ink:#13263b;--sea:#1f4e6b;--gold:#a07a2c;--ol:#5f7036;--bad:#8b3a3a;--ln:#c9c5b8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.6 'Be Vietnam Pro',sans-serif;background:linear-gradient(180deg,#f1efe9,var(--mb))}
h1,h2,h3{font-family:'Playfair Display',serif;margin:.2em 0;line-height:1.2}
h1{font-size:clamp(30px,6vw,56px);font-weight:900}h2{font-size:24px}h3{font-size:18px}
.wrap{max-width:1250px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--ln);border-top:3px solid var(--sea);padding:14px;margin-bottom:12px}
.btn{font:600 15px 'Be Vietnam Pro';background:var(--sea);color:#fff;border:0;padding:10px 18px;cursor:pointer}
.btn.alt{background:none;color:var(--sea);border:1.5px solid var(--sea)}.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold)}
input,select{font:inherit;padding:9px;border:1px solid var(--ln);background:#fff;color:var(--ink);max-width:100%}
.g3{display:grid;gap:12px;grid-template-columns:1fr 1.5fr 1fr}@media(max-width:950px){.g3{grid-template-columns:1fr}}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;background:#fff;border:1.5px solid var(--ln);font:inherit;color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--sea)}
.dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--gold);display:inline-block;margin-right:3px}.dot.on{background:var(--gold)}
.m{border-left:4px solid var(--gold)}.m.done{border-color:var(--ol)}
.vs{display:flex;justify-content:space-between;gap:8px;margin:6px 0}.win{color:var(--ol);font-weight:600}
.log{max-height:230px;overflow:auto;font-size:14px}.log p{margin:3px 0;border-bottom:1px dotted var(--ln)}
small,.mut{color:#566474;font-size:13px}.fl{font:600 18px monospace;background:#fff;padding:8px;border:1px dashed var(--gold);word-break:break-all}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;z-index:9}
.end{position:fixed;inset:0;background:var(--ink);color:#f1efe9;overflow:auto;z-index:5;padding:24px;text-align:center}
.end .r{font:700 clamp(20px,4vw,34px) 'Playfair Display',serif;margin:10px 0}.end .r:first-of-type{color:#d9b560;font-size:clamp(28px,6vw,52px)}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:3px 4px;border-bottom:1px solid var(--ln)}
.hero{text-align:center;padding:40px 10px}
@media(prefers-reduced-motion:no-preference){.pulse{animation:p 2s ease-in-out infinite}@keyframes p{50%{opacity:.55}}}
</style></head><body><div class="wrap" id="app"></div><div class="toast" id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TEAMS=[1,2,3,4,6,7],ROOM=new URLSearchParams(location.search).get('room'),LS=localStorage;
const TEMPLE=`<svg viewBox="0 0 200 90" width="220" aria-hidden="true"><path d="M10 28 100 6l90 22z" fill="#a07a2c"/><rect x="14" y="30" width="172" height="6" fill="#13263b"/>${[30,62,94,126,158].map(x=>`<rect x="${x}" y="38" width="12" height="40" fill="#f5f4ef" stroke="#13263b" stroke-width="2"/>`).join('')}<rect x="8" y="78" width="184" height="8" fill="#1f4e6b"/></svg>`;
const QUOTES=['Tôi chỉ biết rằng tôi không biết gì. — Socrates','Cuộc đời chưa được xem xét thì không đáng sống. — Socrates','Triết học bắt đầu từ sự ngạc nhiên. — Aristotle'];
/* ---------- Đề mẫu: [{title,qs:[{t:'mcq'|'tf'|'fill',q,o,a}]}]  fill: dùng {0},{1} và o=[[..],[..]], a=[idx,idx] ---------- */
const SAMPLE=[{title:"Vấn đề cơ bản của triết học",qs:[{t:"mcq",q:"Vấn đề cơ bản của triết học là quan hệ giữa:",o:["Con người và xã hội","Lý luận và thực tiễn","Tư duy và tồn tại","Vật chất và năng lượng"],a:2},{t:"tf",q:"Chủ nghĩa duy vật cho rằng ý thức có trước vật chất.",a:false},{t:"fill",q:"Theo chủ nghĩa {0}, vật chất có trước, ý thức có {1} và phụ thuộc vào vật chất.",o:[["duy vật","duy tâm","hoài nghi"],["trước","sau","song song"]],a:[0,1]}]},
{title:"Phép biện chứng",qs:[{t:"mcq",q:"Quy luật nào chỉ ra nguồn gốc, động lực của sự phát triển?",o:["Lượng – chất","Phủ định của phủ định","Nhân quả","Thống nhất và đấu tranh của các mặt đối lập"],a:3},{t:"tf",q:"Phương pháp siêu hình xem xét sự vật trong trạng thái vận động, phát triển không ngừng.",a:false},{t:"fill",q:"Quy luật chuyển hoá từ những thay đổi về {0} thành những thay đổi về {1} và ngược lại.",o:[["chất","lượng","hình thức"],["lượng","vị trí","chất"]],a:[1,2]}]},
{title:"Thực tiễn và nhận thức",qs:[{t:"mcq",q:"Tiêu chuẩn của chân lý là:",o:["Thực tiễn","Số đông","Kinh điển","Ý chí"],a:0},{t:"tf",q:"Nhận thức đi từ trực quan sinh động đến tư duy trừu tượng, rồi trở về thực tiễn.",a:true},{t:"fill",q:"Triết học là hệ thống tri thức {0} về thế giới và vị trí của {1} trong thế giới ấy.",o:[["cảm tính","lý luận chung nhất","cụ thể nhất"],["thần linh","tự nhiên","con người"]],a:[1,2]}]}];
/* ---------- âm thanh (WebAudio, không cần file) ---------- */
let AC,mt=0;const NT=[293.66,329.63,369.99,440,493.88,587.33];
addEventListener('pointerdown',()=>AC=AC||new AudioContext(),{once:true});
function tone(f,d=.5,v=.06,ty='sine',t0=0){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}
const sfx={ok:()=>[0,2,4].forEach((n,i)=>tone(NT[n]*2,.4,.07,'triangle',i*.09)),bad:()=>tone(170,.35,.06,'triangle'),flag:()=>[0,2,3,5].forEach((n,i)=>tone(NT[n]*2,.7,.07,'triangle',i*.12)),end:()=>[0,3,5,3,5].forEach((n,i)=>tone(NT[n]*2,.9,.07,'triangle',i*.25))};
function music(){if(mt){clearInterval(mt);mt=0;toast('Tắt nhạc nền');return}AC=AC||new AudioContext();let i=0;const P=[0,2,4,2,3,1,2,0];mt=setInterval(()=>{tone(NT[P[i%8]],1.2,.035);if(i%4==0)tone(NT[0]/2,2.4,.05);i++},650)}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t.h);t.h=setTimeout(()=>t.hidden=true,2400)}
const sh=a=>a.sort(()=>Math.random()-.5),hex=()=>[...crypto.getRandomValues(new Uint8Array(6))].map(b=>b.toString(16).padStart(2,'0')).join('');
const SNDBTN='<button class="btn alt" onclick="music()" aria-label="Nhạc nền">♪ Nhạc</button>';
/* ============================ HOST ============================ */
let S,peer,conns={};
function lb(){const t=TEAMS.map(x=>({t:x,...S.tw[x]})).sort((a,b)=>b.w-a.w||b.f-a.f);const p=Object.values(S.players).sort((a,b)=>b.pts-a.pts).slice(0,10).map(x=>({n:x.name,t:x.team,pts:x.pts}));return{t,p}}
const mOf=t=>S.matches.find(m=>m.a==t||m.b==t),ch=c=>S.qs[(S.stage*3+c)%S.qs.length];
function log(m){S.log.unshift({t:new Date().toLocaleTimeString('vi-VN'),m});S.log.length=Math.min(S.log.length,80)}
function bc(){LS.tl_host=JSON.stringify(S);hostR();for(const pid in conns)try{conns[pid].send(view(pid))}catch{}}
function view(pid){const p=S.players[pid],m=mOf(p.team),o={k:'st',stage:S.stage,me:{n:p.name,t:p.team,pts:p.pts},lb:lb(),rank:S.stage==3?S.rank:null};
 if(m&&S.stage>=0&&S.stage<3){const a=m.prog[p.team],oT=m.a==p.team?m.b:m.a,b=m.prog[oT];o.m={tag:m.tag,opp:oT,my:{c:a.c,q:a.q,s:a.s,flag:a.flag},op:{c:b.c,s:b.s},win:m.win};
  if(!m.win&&!a.flag&&a.c<3){const x=ch(a.c),q=x.qs[a.q];o.m.title=x.title;o.q={t:q.t,q:q.q,o:q.o}}}   // KHÔNG bao giờ gửi đáp án
 return o}
function startStage(n){const T=sh(TEAMS.slice());let pr;
 if(n==0)pr=[[T[0],T[1],'Vòng loại'],[T[2],T[3],'Vòng loại'],[T[4],T[5],'Vòng loại']];
 else{const W=sh(S.matches.map(m=>m.win)),L=sh(S.matches.map(m=>m.lose));
  if(n==1)pr=[[W[0],W[1],'Bán kết: nhánh thắng'],[L[0],L[1],'Bán kết: nhánh thua'],[W[2],L[2],'Bán kết: giao thoa']];
  else{const[ww,ll,wl]=S.matches;S.rank[ll.win]=5;S.rank[ll.lose]=6;pr=[[ww.win,wl.win,'Chung kết: tranh hạng 1-2'],[ww.lose,wl.lose,'Tranh hạng 3-4']]}}
 S.stage=n;S.ready=false;S.matches=pr.map(([a,b,tag])=>({a,b,tag,win:0,lose:0,prog:{[a]:{c:0,q:0,s:0,flag:null},[b]:{c:0,q:0,s:0,flag:null}}}));
 log(`Bắt đầu ${['vòng loại','bán kết','chung kết'][n]}: `+S.matches.map(m=>`Nhóm ${m.a} đấu Nhóm ${m.b}`).join(', '));bc()}
function nextStage(){if(S.stage<0){const miss=TEAMS.filter(t=>!Object.values(S.players).some(p=>p.team==t));if(miss.length&&!confirm('Nhóm '+miss.join(', ')+' chưa có người chơi. Vẫn bắt đầu?'))return}
 if(S.stage>=0&&!S.ready)return;if(S.stage<2)startStage(S.stage+1);else{const[a,b]=S.matches;S.rank[a.win]=1;S.rank[a.lose]=2;S.rank[b.win]=3;S.rank[b.lose]=4;S.stage=3;log('Kết thúc giải đấu!');bc();sfx.end()}}
function ans(c,p,v){const m=mOf(p.team);if(!m||m.win||S.stage<0||S.stage>2)return;const a=m.prog[p.team];if(a.flag||a.c>2)return;
 if(Date.now()<p.cd)return c.send({k:'fb',ok:0,m:'Hãy suy ngẫm thêm chút rồi trả lời.'});   // chống dò đáp án
 const q=ch(a.c).qs[a.q];let ok=q.t=='fill'?Array.isArray(v)&&v.length==q.a.length&&v.every((x,i)=>x===q.a[i]):v===q.a;
 if(!ok){p.cd=Date.now()+2000;return c.send({k:'fb',ok:0,m:'Chưa đúng, hãy thử lại.'})}
 p.pts++;a.q++;c.send({k:'fb',ok:1});
 if(a.q>2){a.flag='FLAG{'+hex()+'}';log(`Nhóm ${p.team} giải xong thử thách ${a.c+1} (${m.tag}), flag đã rơi!`)}bc()}
function flag(c,p,v){const m=mOf(p.team);if(!m||m.win)return;const a=m.prog[p.team];if(!a.flag||String(v).trim()!==a.flag)return c.send({k:'fb',ok:0,m:'Flag chưa chính xác.'});
 a.s++;a.c++;a.q=0;a.flag=null;S.tw[p.team].f++;log(`Nhóm ${p.team} cắm flag thứ ${a.s}/3 vào căn cứ đối thủ (${m.tag})`);
 if(a.s>=3){m.win=p.team;m.lose=m.a==p.team?m.b:m.a;S.tw[p.team].w++;log(`Nhóm ${p.team} chiếm căn cứ Nhóm ${m.lose} (${m.tag})`);if(S.ready=S.matches.every(x=>x.win))log('Mọi trận trong vòng đã kết thúc.')}
 bc();c.send({k:'fb',ok:2})}
function onMsg(c,d){if(!d||typeof d!='object')return;
 if(d.k=='join'){const pid=String(d.pid||'').slice(0,40),n=String(d.name||'').trim().slice(0,20),t=+d.team;let p=S.players[pid];
  if(!p){if(!n||!TEAMS.includes(t))return c.send({k:'err',m:'Tên hoặc nhóm không hợp lệ'});p=S.players[pid]={name:n,team:t,pts:0,cd:0};log(`${n} gia nhập Nhóm ${t}`)}
  c.pid=pid;conns[pid]=c;return bc()}
 const p=S.players[c.pid];if(!p)return;if(d.k=='ans')ans(c,p,d.v);if(d.k=='flag')flag(c,p,d.v)}
function startHost(){peer=new Peer('trietly-'+S.room);
 peer.on('connection',c=>c.on('data',d=>onMsg(c,d)));
 peer.on('error',x=>alert(x.type=='unavailable-id'?'Phòng đang mở ở tab khác. Hãy đóng tab đó rồi tải lại.':'Lỗi kết nối: '+x.type));
 peer.on('open',()=>{hostUI();bc()})}
function hostLanding(){const old=LS.tl_host;$('#app').innerHTML=`<div class="hero">${TEMPLE}<h1>Đấu Trường Triết Học</h1><p style="max-width:560px;margin:auto">Sáu nhóm tấn công căn cứ của nhau bằng tri thức. Ai giải xong ba thử thách và cắm đủ ba flag trước sẽ thắng.</p><p><button class="btn" id="nr">Tạo phòng mới</button> ${old?'<button class="btn alt" id="rs">Mở lại phòng đang dở</button>':''}</p><p class="mut">${QUOTES[Math.random()*3|0]}</p></div>`;
 $('#nr').onclick=()=>{S={room:Math.random().toString(36).slice(2,6).toUpperCase(),qs:SAMPLE,stage:-1,ready:false,matches:[],players:{},tw:{},rank:{},log:[]};TEAMS.forEach(t=>S.tw[t]={w:0,f:0});startHost()};
 if(old)$('#rs').onclick=()=>{S=JSON.parse(old);startHost()}}
function hostUI(){const url=location.origin+location.pathname+'?room='+S.room;
 $('#app').innerHTML=`<div class="top"><div style="display:flex;gap:12px;align-items:center">${TEMPLE.replace('220','90')}<div><h2>Đấu Trường Triết Học</h2><small id="stg"></small></div></div><div>${SNDBTN} <label class="btn alt">Nạp đề <input type="file" id="qf" accept=".json" hidden></label> <button class="btn" id="nx"></button></div></div>
 <div class="g3"><div><div class="card" style="text-align:center"><h3>Mã phòng ${S.room}</h3><div id="qr" style="display:inline-block"></div><p><small style="word-break:break-all">${url}</small></p></div><div class="card"><h3>Người chơi</h3><div id="ro"></div></div></div>
 <div><div id="mt"></div><div class="card"><h3>Nhật ký trận đấu</h3><div class="log" id="lg"></div></div></div>
 <div><div class="card"><h3>Bảng xếp hạng nhóm</h3><div id="lt"></div></div><div class="card"><h3>Bảng xếp hạng cá nhân</h3><div id="lp"></div></div></div></div><div id="en"></div>`;
 new QRCode($('#qr'),{text:url,width:170,height:170,colorDark:'#13263b',colorLight:'#f5f4ef'});
 $('#nx').onclick=nextStage;
 $('#qf').onchange=async ev=>{try{const j=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(j)||!j.length||!j.every(c=>c.title&&Array.isArray(c.qs)&&c.qs.length==3&&c.qs.every(q=>q.q&&'a' in q)))throw 0;S.qs=j;log(`Đã nạp đề: ${j.length} thử thách`);bc();toast('Đã nạp đề')}catch{toast('File đề không đúng định dạng')}}}
function hostR(){if(!$('#mt'))return;const L=lb();
 $('#stg').textContent=['Phòng chờ','Vòng loại','Bán kết','Chung kết','Kết thúc'][S.stage+1]+` (${S.qs.length} thử thách trong đề)`;
 const nx=$('#nx');nx.hidden=S.stage==3;nx.disabled=S.stage>=0&&!S.ready;nx.textContent=['Bắt đầu vòng loại','Sang bán kết','Sang chung kết','Công bố kết quả'][S.stage<0?0:S.stage+1>3?3:S.stage+1];
 $('#ro').innerHTML=TEAMS.map(t=>`<p style="margin:4px 0"><b>Nhóm ${t}</b> <small>${Object.values(S.players).filter(p=>p.team==t).map(p=>e(p.name)).join(', ')||'chưa có ai'}</small></p>`).join('');
 $('#mt').innerHTML=S.matches.map(m=>`<div class="card m ${m.win?'done':''}"><small>${e(m.tag)}</small><div class="vs">${[m.a,m.b].map(t=>{const a=m.prog[t];return`<div><h3 class="${m.win==t?'win':''}">Nhóm ${t}${m.win==t?' (thắng)':''}</h3>${[0,1,2].map(i=>`<span class="dot ${i<a.s?'on':''}"></span>`).join('')}<br><small>${m.win?'':`Thử thách ${a.c+1}/3, câu ${Math.min(a.q+1,3)}/3${a.flag?', đã có flag':''}`}</small></div>`}).join('<h3 class="mut">đấu</h3>')}</div></div>`).join('')||'<div class="card"><p class="mut pulse">Đang chờ các nhóm vào phòng. Bấm "Bắt đầu vòng loại" khi sẵn sàng.</p></div>';
 $('#lg').innerHTML=S.log.map(l=>`<p><small>${l.t}</small> ${e(l.m)}</p>`).join('');
 $('#lt').innerHTML='<table>'+L.t.map((x,i)=>`<tr><td>${i+1}</td><td>Nhóm ${x.t}</td><td>${x.w} thắng</td><td>${x.f} flag</td></tr>`).join('')+'</table>';
 $('#lp').innerHTML='<table>'+L.p.map((x,i)=>`<tr><td>${i+1}</td><td>${e(x.n)}</td><td>Nhóm ${x.t}</td><td>${x.pts}</td></tr>`).join('')+'</table>';
 $('#en').innerHTML=S.stage==3?`<div class="end">${TEMPLE.replace('220','200')}<h1>Bảng Vàng</h1>${Object.entries(S.rank).sort((a,b)=>a[1]-b[1]).map(([t,r])=>`<div class="r">Hạng ${r}: Nhóm ${t}</div>`).join('')}<h3>Những người đóng góp nhiều nhất</h3>${L.p.slice(0,5).map((x,i)=>`<div>${i+1}. ${e(x.n)} (Nhóm ${x.t}): ${x.pts} điểm</div>`).join('')}<p><button class="btn alt" style="color:#fff;border-color:#fff" onclick="$('#en').innerHTML=''">Đóng</button></p></div>`:''}
/* ============================ PLAYER ============================ */
let conn,pp,V,sig='',me=JSON.parse(LS['tl_p_'+ROOM]||'null');
function playerJoin(){$('#app').innerHTML=`<div class="hero">${TEMPLE}<h1>Vào đấu trường</h1><div class="card" style="max-width:380px;margin:20px auto;text-align:left"><p>Tên của bạn<br><input id="nm" maxlength="20" style="width:100%"></p><p>Nhóm của bạn<br><select id="tm" style="width:100%">${TEAMS.map(t=>`<option value="${t}">Nhóm ${t}</option>`).join('')}</select></p><button class="btn" id="go" style="width:100%">Tham gia</button></div></div>`;
 $('#go').onclick=()=>{const n=$('#nm').value.trim();if(!n)return toast('Hãy nhập tên');me={pid:hex()+hex(),name:n,team:+$('#tm').value};LS['tl_p_'+ROOM]=JSON.stringify(me);connect()}}
function connect(){$('#app').innerHTML='<div class="hero"><h2 class="pulse">Đang kết nối tới phòng '+e(ROOM)+'…</h2></div>';
 const retry=()=>{clearTimeout(connect.t);connect.t=setTimeout(()=>{try{pp.destroy()}catch{}connect()},2500)};
 pp=new Peer();pp.on('error',retry);
 pp.on('open',()=>{conn=pp.connect('trietly-'+ROOM,{reliable:true});conn.on('open',()=>conn.send({k:'join',pid:me.pid,name:me.name,team:me.team}));conn.on('data',onData);conn.on('close',retry);conn.on('error',retry)})}
function send(o){try{conn.send(o)}catch{toast('Mất kết nối, đang nối lại…')}}
function onData(d){if(d.k=='err'){delete LS['tl_p_'+ROOM];me=null;toast(d.m);return playerJoin()}
 if(d.k=='fb'){toast(d.m||(d.ok==1?'Chính xác!':'Cờ đã cắm vào căn cứ đối thủ!'));(d.ok?d.ok==2?sfx.flag:sfx.ok:sfx.bad)();return}
 if(d.k=='st'){const old=V;V=d;if(!$('#qb'))skeleton();pR();if(V.stage==3&&(!old||old.stage!=3))sfx.end()}}
function skeleton(){$('#app').innerHTML=`<div class="top"><div id="hd"></div>${SNDBTN}</div><div id="mi"></div><div id="qb"></div><div class="card"><h3>Bảng xếp hạng</h3><div id="pl"></div></div>`}
function pR(){const v=V;$('#hd').innerHTML=`<h2>${e(v.me.n)}</h2><small>Nhóm ${v.me.t}, ${v.me.pts} điểm cá nhân</small>`;
 $('#pl').innerHTML='<table>'+v.lb.t.map((x,i)=>`<tr><td>${i+1}</td><td>Nhóm ${x.t}</td><td>${x.w} thắng</td><td>${x.f} flag</td></tr>`).join('')+'</table><br><table>'+v.lb.p.slice(0,5).map((x,i)=>`<tr><td>${i+1}</td><td>${e(x.n)}</td><td>${x.pts}</td></tr>`).join('')+'</table>';
 const m=v.m;$('#mi').innerHTML=m?`<div class="card m"><small>${e(m.tag)}</small><div class="vs"><div><b>Nhóm ${v.me.t}</b><br>${[0,1,2].map(i=>`<span class="dot ${i<m.my.s?'on':''}"></span>`).join('')}</div><div style="text-align:right"><b>Nhóm ${m.opp}</b><br>${[0,1,2].map(i=>`<span class="dot ${i<m.op.s?'on':''}"></span>`).join('')}</div></div></div>`:'';
 const ns=JSON.stringify([v.stage,v.q,m&&m.my.flag,m&&m.win]);if(ns==sig)return;sig=ns;const qb=$('#qb');let h='';
 if(v.stage<0)h='<div class="card"><h3 class="pulse">Phòng chờ</h3><p>Chủ trò sẽ bắt đầu trận đấu trong giây lát.</p></div>';
 else if(v.stage==3)h=`<div class="card"><h2>Kết quả chung cuộc</h2>${Object.entries(v.rank).sort((a,b)=>a[1]-b[1]).map(([t,r])=>`<p class="${t==v.me.t?'win':''}">Hạng ${r}: Nhóm ${t}</p>`).join('')}</div>`;
 else if(m&&m.win)h=`<div class="card"><h2 class="${m.win==v.me.t?'win':''}">${m.win==v.me.t?'Nhóm bạn đã chiếm được căn cứ!':'Căn cứ của nhóm bạn đã thất thủ.'}</h2><p>Hãy chờ chủ trò mở vòng tiếp theo.</p></div>`;
 else if(m&&m.my.flag)h=`<div class="card"><h3>Thử thách hoàn thành, flag đã rơi</h3><div class="fl">${e(m.my.flag)}</div><p>Điền flag để cắm vào căn cứ đối thủ:</p><input id="fi" style="width:100%" autocomplete="off"><p><button class="btn" onclick="send({k:'flag',v:$('#fi').value})">Cắm flag</button></p></div>`;
 else if(v.q){const q=v.q;h=`<div class="card"><small>${e(m.title)}, câu ${m.my.q+1}/3</small><h3 style="font-weight:500;font-size:20px">`;
  if(q.t=='fill')h+=e(q.q).replace(/\{(\d)\}/g,(_,i)=>`<select data-i="${i}"><option value="">…</option>${q.o[i].map((o,j)=>`<option value="${j}">${e(o)}</option>`).join('')}</select>`)+`</h3><button class="btn" id="fs">Gửi đáp án</button>`;
  else if(q.t=='tf')h+=e(q.q)+`</h3><button class="opt" data-v="1">Đúng</button><button class="opt" data-v="0">Sai</button>`;
  else h+=e(q.q)+'</h3>'+q.o.map((o,i)=>`<button class="opt" data-v="${i}">${e(o)}</button>`).join('');
  qb.innerHTML=h+'</div>';
  qb.querySelectorAll('.opt').forEach(b=>b.onclick=()=>send({k:'ans',v:q.t=='tf'?b.dataset.v=='1':+b.dataset.v}));
  const fs=$('#fs');if(fs)fs.onclick=()=>{const s=[...qb.querySelectorAll('select')];if(s.some(x=>x.value===''))return toast('Hãy chọn đủ các chỗ trống');send({k:'ans',v:s.map(x=>+x.value)})};return}
 qb.innerHTML=h}
/* ---------- khởi động ---------- */
if(!ROOM)hostLanding();else if(me)connect();else playerJoin();
</script></body></html>
