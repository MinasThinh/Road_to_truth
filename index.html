/* Đề thi KHÔNG nằm trong mã nguồn: host nạp file .json từ máy (xem de-mau.json). Đáp án chỉ tồn tại trong trình duyệt của host. */

let AC,MUTE=LS.tl_mute=='1';const NT=[293.66,329.63,369.99,440,493.88,587.33];

function tone(f,d=.5,v=.06,ty='sine',t0=0){if(!AC||MUTE)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}
const sfx={ok:()=>[0,2,4].forEach((n,i)=>tone(NT[n]*2,.4,.07,'triangle',i*.09)),bad:()=>tone(170,.35,.06,'triangle'),flag:()=>[0,2,3,5].forEach((n,i)=>tone(NT[n]*2,.7,.07,'triangle',i*.12)),shot:()=>tone(110,.5,.09,'sawtooth'),shield:()=>{tone(660,.25,.06,'square');tone(990,.35,.05,'triangle',.05)},boom:()=>{tone(60,1.3,.14,'sawtooth');tone(38,1.6,.12,'square',.05)},end:()=>[0,3,5,3,5].forEach((n,i)=>tone(NT[n]*2,.9,.07,'triangle',i*.25))};

const sh=a=>a.sort(()=>Math.random()-.5),hex=()=>[...crypto.getRandomValues(new Uint8Array(6))].map(b=>b.toString(16).padStart(2,'0')).join('');

const FB={
  apiKey: "AIzaSyAqaiD9tDDjl_tlk-KBMiYIpWKPn-iKfXI",
  authDomain: "roadtotruth-1ac11.firebaseapp.com",
  databaseURL: "https://roadtotruth-1ac11-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "roadtotruth-1ac11",
  storageBucket: "roadtotruth-1ac11.firebasestorage.app",
  messagingSenderId: "595058707456",
  appId: "1:595058707456:web:13aa354adb200aac505ce5"
};
let db,auth,SO=0;const now=()=>Date.now()+SO,SC=el=>isFinite(el)?Math.max(10,Math.round(100-90*Math.max(0,el)/60)):100;const fbOK=()=>!/DÁN|TEN-DU-AN/.test(JSON.stringify(FB));
function fbInit(){if(!firebase.apps.length)firebase.initializeApp(FB);auth=firebase.auth();db=firebase.database();db.ref('.info/serverTimeOffset').on('value',x=>SO=x.val()||0);return new Promise(res=>{const u=auth.onAuthStateChanged(x=>{u();x?res(x):auth.signInAnonymously().then(r=>res(r.user))})})}
const SNDBTN='<button class="btn alt" onclick="mute()">Âm hiệu</button>';
/* ============================ HOST ============================ */
let S,UID,sent={},DM;const mk=pid=>({pid,send:o=>db.ref(`rooms/${S.room}/${o.k=='fb'?'fb':'st'}/${pid}`).set({...o,n:Date.now()})});
function lb(){const p=Object.values(S.players).sort((a,b)=>b.pts-a.pts).slice(0,10).map(x=>({n:x.name,t:x.team,pts:x.pts}));return{p}}
const mOf=t=>S.matches.find(m=>m.a==t||m.b==t),ch=c=>S.qs[S.stage][c];

function bc(){LS.tl_host=JSON.stringify(S);hostR();for(const pid in S.players){const v=JSON.stringify(view(pid));if(sent[pid]!==v){sent[pid]=v;db.ref(`rooms/${S.room}/st/${pid}`).set(JSON.parse(v))}}}
function view(pid){const p=S.players[pid],m=mOf(p.team),o={k:'st',stage:S.stage,me:{n:p.name,t:p.team,pts:p.pts},lb:lb(),rank:S.stage==3?Object.fromEntries(Object.entries(S.rank).map(([t,r])=>['t'+t,r])):null};
 if(m&&S.stage>=0&&S.stage<3){const a=m.prog[p.team],oT=m.a==p.team?m.b:m.a,b=m.prog[oT];o.m={tag:m.tag,opp:oT,my:{c:a.c,q:a.q,s:a.s,last:a.last||null,t0:a.t0},op:{c:b.c,s:b.s},win:m.win};
  if(!m.win&&!a.flag&&a.c<3){const x=ch(a.c),q=x.qs[a.q];o.m.title=x.title;o.q={t:q.t,q:q.q,o:q.o}}}   // KHÔNG bao giờ gửi đáp án
 return o}
function startStage(n){const T=sh(TEAMS.slice());let pr;
 if(n==0)pr=[[T[0],T[1],'Vòng loại'],[T[2],T[3],'Vòng loại'],[T[4],T[5],'Vòng loại']];
 else{const W=sh(S.matches.map(m=>m.win)),L=sh(S.matches.map(m=>m.lose));
  if(n==1)pr=[[W[0],W[1],'Bán kết: nhánh thắng'],[L[0],L[1],'Bán kết: nhánh thua'],[W[2],L[2],'Bán kết: giao thoa']];
  else{const[ww,ll,wl]=S.matches;S.rank[ll.win]=5;S.rank[ll.lose]=6;pr=[[ww.win,wl.win,'Chung kết: tranh hạng 1-2'],[ww.lose,wl.lose,'Tranh hạng 3-4']]}}
 S.stage=n;S.ready=false;S.matches=pr.map(([a,b,tag])=>({a,b,tag,win:0,lose:0,prog:{[a]:{c:0,q:0,s:0,flag:null,t0:now()},[b]:{c:0,q:0,s:0,flag:null,t0:now()}}}));
 log(`Bắt đầu ${['vòng loại','bán kết','chung kết'][n]}: `+S.matches.map(m=>`Nhóm ${m.a} đấu Nhóm ${m.b}`).join(', '));bc()}
function nextStage(){if(S.stage<0&&!S.qs.length)return toast('Hãy nạp file đề (.json) trước');if(S.stage<0){const miss=TEAMS.filter(t=>!Object.values(S.players).some(p=>p.team==t));if(miss.length&&!confirm('Nhóm '+miss.join(', ')+' chưa có người chơi. Vẫn bắt đầu?'))return}
 if(S.stage>=0&&!S.ready)return;if(S.stage<2)startStage(S.stage+1);else{const[a,b]=S.matches;S.rank[a.win]=1;S.rank[a.lose]=2;S.rank[b.win]=3;S.rank[b.lose]=4;S.stage=3;log('Kết thúc giải đấu!');bc();sfx.end();boom(3)}}
function ans(c,p,v,qi){const m=mOf(p.team);if(!m||m.win||S.stage<0||S.stage>2)return;const a=m.prog[p.team];if(a.flag||a.c>2)return;
 if(qi!==a.c*3+a.q)return c.send({k:'fb',ok:0,m:'Đồng đội vừa trả lời câu này rồi.'});
 if(Date.now()<p.cd||Date.now()<(a.lk||0))return c.send({k:'fb',ok:0,m:'Hãy suy ngẫm thêm chút rồi trả lời.'});
 const q=ch(a.c).qs[a.q];let ok=q.t=='fill'?Array.isArray(v)&&v.length==q.a.length&&v.every((x,i)=>x===q.a[i]):v===q.a;
 if(!ok){a.w=(a.w||0)+1;p.cd=Date.now()+2000;if(a.w%3==0)a.lk=Date.now()+Math.min(a.w*2500,20000);return c.send({k:'fb',ok:0,m:a.lk>Date.now()?'Nhóm bị khoá tạm thời vì trả lời sai liên tiếp.':'Chưa đúng, hãy thử lại.'})}
 const pt=SC((now()-(a.t0||now()))/1000);p.pts+=pt;a.q++;a.w=0;a.lk=0;a.t0=now();c.send({k:'fb',ok:1,m:'+'+pt+' điểm'});
 if(a.q>2){const f='FLAG{'+hex()+'}';a.last=f;a.s++;a.c++;a.q=0;S.tw[p.team].f++;const o=m.a==p.team?m.b:m.a,fbd=a.s==1&&m.prog[o].s==0;log(`Nhóm ${p.team} ${a.s>=3?'đã chiếm đóng thành công căn cứ':fbd?'đã tấn công phủ đầu':'đã nả pháo vào căn cứ'} Nhóm ${o}`);shoot(p.team,o,a.s);
  if(a.s>=3){m.win=p.team;m.lose=m.a==p.team?m.b:m.a;S.tw[p.team].w++;if(S.ready=S.matches.every(x=>x.win))log('Mọi trận trong vòng đã kết thúc.')}}bc()}
function onMsg(c,d){if(!d||typeof d!='object')return;
 if(d.k=='join'){const pid=c.pid,n=String(d.name||'').trim().slice(0,20),t=+d.team;let p=S.players[pid];
  if(!p){if(!n||!TEAMS.includes(t)||Object.keys(S.players).length>=80)return c.send({k:'err',m:'Tên hoặc nhóm không hợp lệ'});p=S.players[pid]={name:n,team:t,pts:0,cd:0};log(`${n} gia nhập Nhóm ${t}`,1)}

async function startHost(){try{UID=(await fbInit()).uid;const r=await db.ref(`rooms/${S.room}/host`).transaction(c=>c===null||c===UID?UID:undefined);

function hostLanding(){const old=LS.tl_host;$('#app').innerHTML=`<div class="hero">${TEMPLE}<h1 class="gl">Đấu Trường Triết Học</h1><p style="max-width:560px;margin:auto">Sáu nhóm tấn công căn cứ của nhau bằng tri thức. Ai giải xong ba thử thách và cắm đủ ba flag trước sẽ thắng.</p><p><button class="btn" id="nr">Tạo phòng mới</button> ${old?'<button class="btn alt" id="rs">Mở lại phòng đang dở</button>':''}</p><p class="mut">${QUOTES[Math.random()*3|0]}</p></div>`;

function hostUI(){const url=location.origin+location.pathname+'?room='+S.room;
 $('#app').innerHTML=`<div class="top"><div style="display:flex;gap:12px;align-items:center">${TEMPLE.replace('220','90')}<div><h2>Đấu Trường Triết Học</h2><small id="stg"></small></div></div><div>${SNDBTN} <label class="btn alt">Nạp đề <input type="file" id="qf" accept=".json" hidden></label> <button class="btn" id="nx"></button></div></div>
 <div id="lobby" class="g2"><div><div class="card" style="text-align:center"><h3>Mã phòng ${S.room}</h3><div id="qr" style="display:inline-block;padding:8px;background:#fff"></div><p><small style="word-break:break-all">${url}</small></p></div><div id="mt0"></div></div><div id="lr"><div class="card"><h3>Người chơi</h3><div id="ro"></div></div></div></div>
 <div id="game" hidden><div id="gl"><div id="mt"></div><div id="cs"></div></div><div id="gr"><div class="card"><h3>Xếp hạng cá nhân</h3><div id="lp"></div></div></div></div>
