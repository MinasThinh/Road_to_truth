<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soạn đề · Đấu Trường Triết Học</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070d17;--pn:#0c1626;--ink:#e8e4d6;--mut:#8b97a8;--gold:#e2b04a;--cy:#4fd1c5;--bad:#ff6b6b;--ln:#1f3147}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.6 'Be Vietnam Pro',sans-serif;background:radial-gradient(ellipse at 50% -10%,#14305a66,transparent 60%),var(--bg)}
h1,h3{font-family:'Playfair Display',serif;margin:.1em 0;color:#f3e9cf;line-height:1.2}h1{font-size:30px;font-weight:900}h3{font-size:18px}
small,.val,.ed-ch em,input,select,textarea{font-family:'JetBrains Mono',monospace}small{color:var(--mut);font-size:12.5px}
.ed-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--ln)}
.ed-act{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 14px 'Be Vietnam Pro',sans-serif;background:var(--gold);color:#1a1204;border:0;padding:9px 14px;cursor:pointer}
.btn.alt{background:transparent;color:var(--cy);box-shadow:inset 0 0 0 1.5px var(--cy)}.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}.btn:disabled{opacity:.3;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.ed-ch:focus-visible,.ed-tab:focus-visible{outline:3px solid var(--cy)}
.ed-lay{display:grid;grid-template-columns:290px 1fr;gap:18px;max-width:1150px;margin:auto;padding:18px}@media(max-width:800px){.ed-lay{grid-template-columns:1fr}}
#side{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:12px}@media(max-width:800px){#side{position:static}}
.ed-tabs{display:flex;gap:4px;margin-bottom:6px}.ed-tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px;background:var(--pn);border:1px solid var(--ln);color:var(--ink);font:600 13px 'Be Vietnam Pro',sans-serif;cursor:pointer}.ed-tab.on{border-color:var(--gold);color:var(--gold)}.ed-tab em{font:normal 12px 'JetBrains Mono',monospace}
.ed-ch{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:9px 10px;background:var(--pn);border:1px solid var(--ln);color:var(--ink);font:inherit;cursor:pointer}
.ed-ch.on{border-color:var(--gold);background:#12233a}.ed-ch b{font-family:'Playfair Display',serif;color:var(--gold);font-size:18px}.ed-ch span{flex:1;overflow:hidden}.ed-ch span small{display:block}
.ed-ch em{font-style:normal;font-size:12px}.ok{color:var(--cy)}.bad{color:var(--bad)}
.val{font-size:12.5px;border:1px solid var(--ln);padding:10px;margin-top:6px;background:var(--pn)}.val ul{margin:6px 0 0;padding-left:18px}.val.ok{border-color:var(--cy)}.val.bad{border-color:var(--bad)}
.ed-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ed-ti{flex:1;min-width:220px;font:700 22px 'Playfair Display',serif;color:#f3e9cf}
input,select,textarea{font-size:14px;color:var(--ink);background:#09111e;border:1px solid var(--ln);padding:9px;max-width:100%}
textarea{width:100%;resize:vertical;font-family:'Be Vietnam Pro',sans-serif;font-size:16px}
.ed-q{background:var(--pn);border:1px solid var(--ln);border-left:3px solid var(--cy);padding:14px;margin-bottom:12px}
.ed-qh{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.ed-qh b{font:700 18px 'Playfair Display',serif;color:var(--gold)}.ed-sp{flex:1}
.ed-row{display:flex;gap:8px;align-items:center;margin:6px 0}.ed-row .ed-tx{flex:1;min-width:0}.ed-row input[type=radio]{width:20px;height:20px;accent-color:var(--gold);flex:none}
.ed-tf{display:flex;gap:8px;align-items:center;margin:6px 0}.ed-tf .ed-tx{flex:1;min-width:0}.ed-tf label{white-space:nowrap;cursor:pointer;font-size:14px}.ed-tf input[type=radio]{width:18px;height:18px;accent-color:var(--gold);vertical-align:-3px}
.ed-bl{border-top:1px dashed var(--ln);margin-top:10px;padding-top:8px}.ed-fh{margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ed-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0d1b2e;border:1px solid var(--cy);padding:10px 18px;z-index:9}
</style></head><body>
<header class="ed-hd"><div><h1>Soạn đề thi</h1><small>3 vòng (vòng loại, bán kết, chung kết). Mỗi vòng có 3 thử thách theo dạng cố định: 1 trắc nghiệm, 2 điền khuyết, 3 đúng sai 4 ý. File chứa đáp án, hãy giữ riêng tư, đừng đưa lên GitHub.</small></div>
<div class="ed-act"><button class="btn alt" onclick="newBank()">Tạo đề mới</button><button class="btn alt" onclick="$('#fi').click()">Nạp đề để sửa tiếp</button><button class="btn alt" onclick="cp()">Sao chép JSON</button><button class="btn" onclick="dl()">Tải xuống</button></div></header>
<div class="ed-lay"><aside id="side"></aside><section id="main"></section></div>
<input type="file" id="fi" accept=".json,application/json" hidden><div class="ed-toast" id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RN=['Vòng loại','Bán kết','Chung kết'],TY=['mcq','fill','tf'],TN=['Trắc nghiệm 4 đáp án','Điền khuyết','Đúng sai 4 ý'];
let B,sel=0,rd=0,jo=false;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t.h);t.h=setTimeout(()=>t.hidden=true,2500)}
/* ---------- mô hình dữ liệu ---------- */
const blanks=q=>{const m=[...q.q.matchAll(/\{(\d+)\}/g)].map(x=>+x[1]);return m.length?Math.min(8,Math.max(...m)+1):0};
function sync(q){const n=blanks(q);q.o=(q.o||[]).slice(0,n);q.a=(q.a||[]).slice(0,n);for(let b=0;b<n;b++){if(!Array.isArray(q.o[b]))q.o[b]=['',''];if(!Number.isInteger(q.a[b]))q.a[b]=0}return q}
const mkQ=(t,q='')=>t=='tf'?{t,q,o:['','','',''],a:[true,true,true,true]}:t=='fill'?sync({t,q,o:[],a:[]}):{t:'mcq',q,o:['','','',''],a:0};
const mkC=i=>({title:'',qs:[0,1,2].map(()=>mkQ(TY[i]))}),mkB=()=>[0,1,2].map(()=>[0,1,2].map(mkC));
function norm(x){if(!Array.isArray(x))throw 0;return x.map(c=>({title:String(c.title||''),qs:(Array.isArray(c.qs)?c.qs:[]).map(q=>{if(!q||!TY.includes(q.t))return null;const o={t:q.t,q:String(q.q||'')};
 if(q.t=='mcq'){o.o=[0,1,2,3].map(k=>String((q.o||[])[k]||''));o.a=Number.isInteger(q.a)?q.a:0}
 else if(q.t=='tf'){o.o=[0,1,2,3].map(k=>String((q.o||[])[k]||''));o.a=[0,1,2,3].map(k=>Array.isArray(q.a)?q.a[k]===true:k==0&&q.a===true)}
 else{o.o=(q.o||[]).map(a=>(a||[]).map(String));o.a=(q.a||[]).map(n=>+n||0);sync(o)}return o}).filter(Boolean)}))}
const fit=Rn=>{Rn=norm(Rn);while(Rn.length<3)Rn.push(mkC(Rn.length));return Rn.slice(0,3)};
try{const x=JSON.parse(localStorage.tl_editor3||'null');if(x&&Array.isArray(x.rounds)&&x.rounds.length==3)B=x.rounds.map(fit)}catch{}
B=B||mkB();
function val(){const E=[];B.forEach((Rn,r)=>Rn.forEach((c,i)=>{const L=`${RN[r]}, thử thách ${i+1}`;if(!c.title.trim())E.push(`${L}: chưa có tên`);if(c.qs.length!=3)E.push(`${L}: có ${c.qs.length}/3 câu`);
 c.qs.forEach((q,j)=>{const P=`${L}, câu ${j+1}`;if(q.t!=TY[i])E.push(`${P}: phải là dạng ${TN[i]}`);if(!q.q.trim())E.push(`${P}: chưa có nội dung`);
  if((q.t=='mcq'||q.t=='tf')&&q.o.some(o=>!o.trim()))E.push(`${P}: còn ${q.t=='tf'?'ý':'đáp án'} trống`);
  if(q.t=='fill'){const n=blanks(q);if(!n)E.push(`${P}: chưa có chỗ trống {0}`);for(let b=0;b<n;b++){if(!q.q.includes(`{${b}}`))E.push(`${P}: thiếu chỗ trống {${b}} trong câu`);const f=q.o[b].filter(x=>x.trim());if(f.length<2)E.push(`${P}: chỗ trống {${b}} cần ít nhất 2 lựa chọn`);else if(!(q.o[b][q.a[b]]||'').trim())E.push(`${P}: đáp án đúng của {${b}} đang trống`)}}})}));return E}
const cleanL=L=>L.map(c=>({title:c.title.trim(),qs:c.qs.map(q=>{const o={t:q.t,q:q.q.trim()};if(q.t=='mcq'){o.o=q.o.map(s=>s.trim());o.a=q.a}else if(q.t=='tf'){o.o=q.o.map(s=>s.trim());o.a=q.a.map(Boolean)}else{o.o=[];o.a=[];for(let b=0;b<blanks(q);b++){const ok=q.o[b]||[],cor=(ok[q.a[b]]||'').trim(),f=ok.map(s=>s.trim()).filter(Boolean);o.o.push(f);o.a.push(Math.max(0,f.indexOf(cor)))}}return o})}));
const clean=()=>({rounds:RN.map((n,r)=>({name:n,challenges:cleanL(B[r])}))});
/* ---------- hiển thị ---------- */
function touch(){localStorage.tl_editor3=JSON.stringify({rounds:B});side()}
function side(){const E=val(),n=B.flat().length;$('#side').innerHTML=`<div class="ed-tabs">${RN.map((nm,r)=>`<button class="ed-tab ${r==rd?'on':''}" onclick="pickR(${r})">${nm}<em class="${B[r].every(c=>c.qs.length==3)?'ok':'bad'}">${B[r].reduce((a,c)=>a+c.qs.length,0)}/9 câu</em></button>`).join('')}</div><h3>${RN[rd]}: 3 thử thách</h3>`+B[rd].map((c,i)=>`<button class="ed-ch ${i==sel?'on':''}" onclick="pick(${i})"><b>${i+1}</b><span>${e(c.title||'(chưa đặt tên)')}<small>${TN[i]}</small></span><em class="${c.qs.length==3?'ok':'bad'}">${c.qs.length}/3</em></button>`).join('')+
 `<div class="val ${E.length?'bad':'ok'}">${E.length?`<b>${E.length} vấn đề cần sửa</b><ul>${E.slice(0,12).map(x=>`<li>${e(x)}</li>`).join('')}${E.length>12?'<li>…</li>':''}</ul>`:`<b>Đề hợp lệ:</b> 3 vòng, ${n} thử thách, ${n*3} câu`}<br><small>Mỗi vòng có bộ đề riêng. Trả lời sai bị trừ 10 điểm cá nhân; đúng sai 4 ý phải đúng cả 4 ý mới qua câu.</small></div>`}
function main(){const c=B[rd][sel];
 $('#main').innerHTML=`<div class="ed-top"><small style="width:100%">${RN[rd]}, thử thách ${sel+1}: ${TN[sel]}</small><input class="ed-ti" value="${e(c.title)}" placeholder="Tên thử thách" aria-label="Tên thử thách" oninput="B[rd][sel].title=this.value;touch()"><button class="btn alt sm" onclick="toggleJ()">Sửa bằng JSON</button><button class="btn danger sm" onclick="rstC()">Làm trống thử thách</button></div>`+(jo?jpanel(c):'')+
 c.qs.map((q,i)=>{try{return qCard(q,i)}catch(x){return `<div class="ed-q"><b class="bad">Không hiển thị được câu ${i+1}: ${e(x.message)}</b><br><button class="btn danger sm" onclick="delQ(${i})">Xóa câu này</button></div>`}}).join('')+`<button class="btn" onclick="addQ()" ${c.qs.length>=3?'disabled':''}>+ Thêm câu hỏi</button> <small>${c.qs.length>=3?'Đã đủ 3 câu. Sửa trực tiếp từng câu ở trên; muốn thêm câu mới thì xóa bớt một câu trước.':'Mỗi thử thách cần đúng 3 câu.'}</small>`}
const R=()=>{side();main()};
function qCard(q,i){const c=B[rd][sel];
 return `<div class="ed-q"><div class="ed-qh"><b>Câu ${i+1}</b><span class="ed-sp"></span><button class="btn alt sm" onclick="mvQ(${i},-1)" ${i==0?'disabled':''} aria-label="Đưa lên">↑</button><button class="btn alt sm" onclick="mvQ(${i},1)" ${i==c.qs.length-1?'disabled':''} aria-label="Đưa xuống">↓</button><button class="btn danger sm" onclick="delQ(${i})">Xóa</button></div>
 <textarea rows="2" aria-label="Nội dung câu hỏi" placeholder="${q.t=='fill'?'Ví dụ: Theo chủ nghĩa {0}, vật chất có trước, ý thức có {1}.':q.t=='tf'?'Câu dẫn chung cho 4 ý bên dưới':'Nội dung câu hỏi'}" oninput="setQ(${i},this.value)">${e(q.q)}</textarea>`+
 (q.t=='mcq'?`<small>Chọn nút tròn ở đáp án đúng.</small>`+q.o.map((o,k)=>`<label class="ed-row"><input type="radio" name="c${i}" aria-label="Đáp án đúng" ${q.a==k?'checked':''} onchange="B[rd][sel].qs[${i}].a=${k};touch()"><input class="ed-tx" value="${e(o)}" placeholder="Đáp án ${'ABCD'[k]}" oninput="B[rd][sel].qs[${i}].o[${k}]=this.value;touch()"></label>`).join('')
 :q.t=='tf'?`<small>Nhập 4 ý và chọn Đúng hoặc Sai cho từng ý. Người chơi phải chọn đúng cả 4 ý mới qua câu.</small>`+q.o.map((o,k)=>`<div class="ed-tf"><input class="ed-tx" value="${e(o)}" placeholder="Ý ${k+1}" oninput="B[rd][sel].qs[${i}].o[${k}]=this.value;touch()"><label><input type="radio" name="t${i}_${k}" ${q.a[k]?'checked':''} onchange="B[rd][sel].qs[${i}].a[${k}]=true;touch()"> Đúng</label><label><input type="radio" name="t${i}_${k}" ${q.a[k]?'':'checked'} onchange="B[rd][sel].qs[${i}].a[${k}]=false;touch()"> Sai</label></div>`).join('')
 :`<div class="ed-fh"><button class="btn alt sm" onclick="insBlank(${i})">+ Chèn chỗ trống</button><small>Dùng {0}, {1}… trong câu rồi nhập các lựa chọn bên dưới.</small></div><div id="fb${i}">${fillB(q,i)}</div>`)+'</div>'}
function fillB(q,i){const n=blanks(q);if(!n)return '<small>Chưa có chỗ trống nào trong câu.</small>';let h='';for(let b=0;b<n;b++){h+=`<div class="ed-bl"><b>Chỗ trống {${b}}</b>`+q.o[b].map((o,k)=>`<div class="ed-row"><input type="radio" name="f${i}_${b}" aria-label="Lựa chọn đúng" ${q.a[b]==k?'checked':''} onchange="B[rd][sel].qs[${i}].a[${b}]=${k};touch()"><input class="ed-tx" value="${e(o)}" placeholder="Lựa chọn ${k+1}" oninput="B[rd][sel].qs[${i}].o[${b}][${k}]=this.value;touch()">${q.o[b].length>2?`<button class="btn danger sm" onclick="delFo(${i},${b},${k})" aria-label="Xóa lựa chọn">✕</button>`:''}</div>`).join('')+(q.o[b].length<6?`<button class="btn alt sm" onclick="addFo(${i},${b})">+ Lựa chọn</button>`:'')+'</div>'}return h}
const jpanel=c=>`<div style="margin-bottom:14px"><textarea id="jt" rows="16" style="font:13px 'JetBrains Mono',monospace">${e(JSON.stringify(c,null,1))}</textarea><div style="margin:6px 0"><button class="btn sm" onclick="applyJ()">Áp dụng</button> <button class="btn alt sm" onclick="toggleJ()">Đóng</button></div><small>mcq: o có 4 đáp án, a là số thứ tự đáp án đúng (từ 0). fill: q có {0}, o là mảng lựa chọn cho từng chỗ trống, a là số thứ tự đúng. tf: o có 4 ý, a có 4 giá trị true/false.</small></div>`;
/* ---------- thao tác ---------- */
const Q=i=>B[rd][sel].qs[i],refill=i=>{$('#fb'+i).innerHTML=fillB(Q(i),i)};
function toggleJ(){jo=!jo;main()}
function applyJ(){try{const [c]=norm([JSON.parse($('#jt').value)]);B[rd][sel]=c;jo=false;R();touch();toast('Đã áp dụng')}catch{toast('JSON không hợp lệ')}}
function pick(i){sel=i;jo=false;R()}
function pickR(r){rd=r;sel=0;jo=false;R()}
function rstC(){if(!confirm('Làm trống thử thách này?'))return;B[rd][sel]=mkC(sel);R();touch()}
function addQ(){if(B[rd][sel].qs.length<3){B[rd][sel].qs.push(mkQ(TY[sel]));main();touch()}}
function delQ(i){if(!confirm('Xóa câu này?'))return;B[rd][sel].qs.splice(i,1);main();touch()}
function mvQ(i,d){const a=B[rd][sel].qs;[a[i],a[i+d]]=[a[i+d],a[i]];main();touch()}
function setQ(i,v){const q=Q(i);q.q=v;if(q.t=='fill'){sync(q);refill(i)}touch()}
function insBlank(i){const ta=document.querySelectorAll('.ed-q')[i].querySelector('textarea'),p=ta.selectionStart??ta.value.length,tag=`{${blanks({q:ta.value})}}`;ta.value=ta.value.slice(0,p)+tag+ta.value.slice(p);ta.focus();ta.setSelectionRange(p+tag.length,p+tag.length);setQ(i,ta.value)}
function addFo(i,b){Q(i).o[b].push('');refill(i);touch()}
function delFo(i,b,k){const q=Q(i);q.o[b].splice(k,1);if(q.a[b]>k)q.a[b]--;else if(q.a[b]==k)q.a[b]=0;refill(i);touch()}
function newBank(){if(!confirm('Bỏ đề hiện tại và tạo đề mới? (Hãy tải xuống trước nếu cần giữ)'))return;B=mkB();rd=0;sel=0;R();touch()}
/* ---------- nạp / xuất file ---------- */
function parseBank(j){if(Array.isArray(j)){const L=norm(j);return[0,1,2].map(r=>fit(L.slice(r*3,r*3+3)))}if(j&&Array.isArray(j.rounds))return[0,1,2].map(r=>fit((j.rounds[r]||{}).challenges||[]));throw 0}
$('#fi').onchange=async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;try{const L=parseBank(JSON.parse(await f.text()));if(!confirm('Thay thế đề hiện tại bằng file này?'))return;B=L;rd=0;sel=0;jo=false;R();touch();toast('Đã nạp đề')}catch{toast('File không đúng định dạng đề thi')}};
function dl(){const E=val();if(E.length&&!confirm(`Còn ${E.length} vấn đề chưa sửa. Vẫn tải xuống?`))return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(clean(),null,1)],{type:'application/json'}));a.download='de-thi.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function cp(){navigator.clipboard.writeText(JSON.stringify(clean(),null,1)).then(()=>toast('Đã sao chép JSON'),()=>toast('Không sao chép được'))}
addEventListener('error',x=>toast('Lỗi: '+x.message));R();
</script></body></html>
